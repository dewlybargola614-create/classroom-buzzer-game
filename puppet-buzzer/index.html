<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puppet Buzzer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: a puppet-theater stage in the middle, one giant buzzer on each side; teacher controls tucked along the bottom. Single dark "stage" look on purpose. */
:root {
  color-scheme: dark;
  --bg: #1A1322;          /* dark theater */
  --stage: #261C31;       /* stage card */
  --stage-2: #31253F;
  --curtain: #8C2433;     /* curtain valance */
  --curtain-2: #6B1A27;
  --ink: #FBF6EC;
  --muted: #B8AEC6;
  --line: #43355A;
  --boys: #2CB8D8;
  --boys-deep: #12708A;
  --girls: #FF7A59;
  --girls-deep: #B5442B;
  --gold: #F2B544;
  --ok: #3FBF7F;
  --bad: #E5484D;
  --rod: #E5573F; --string: #4B8BE6; --glove: #F2B544; --shadow: #9474DB;
  --f-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.2rem, 2.2vw, 1.9rem); letter-spacing: .01em; }
.logo span { color: var(--gold); }
.round { font-family: var(--f-display); font-weight: 600; font-size: clamp(1rem, 1.8vw, 1.5rem); color: var(--muted); font-variant-numeric: tabular-nums; }
.round b { color: var(--ink); }
.tools { display: flex; gap: 8px; }
.icon-btn { background: var(--stage-2); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font: 700 .95rem var(--f-body); cursor: pointer; }
.icon-btn:focus-visible, .ctl:focus-visible, .buzz:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* main */
.main { display: grid; grid-template-columns: minmax(150px, 21%) 1fr minmax(150px, 21%); gap: clamp(10px, 1.6vw, 24px); min-height: 0; }
.side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
.buzz {
  --c: var(--boys); --cd: var(--boys-deep);
  width: min(100%, 30vh); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, white) 0%, var(--c) 45%, var(--cd) 100%);
  box-shadow: 0 10px 0 var(--cd), 0 18px 40px rgba(0,0,0,.45);
  color: #fff; display: grid; place-items: center; align-content: center; gap: 2px;
  font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 3rem); letter-spacing: .04em;
  transition: transform .08s, filter .2s, opacity .2s;
}
.buzz small { font-family: var(--f-zh); font-weight: 700; font-size: .45em; letter-spacing: 0; opacity: .95; }
.buzz.girls { --c: var(--girls); --cd: var(--girls-deep); }
.buzz:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--cd), 0 10px 24px rgba(0,0,0,.45); }
.buzz.ready { animation: pulse 1.6s ease-in-out infinite; }
.buzz.won { animation: none; filter: brightness(1.15); box-shadow: 0 10px 0 var(--cd), 0 0 0 10px color-mix(in srgb, var(--c) 35%, transparent), 0 0 60px var(--c); }
.buzz.off { opacity: .28; filter: grayscale(.6); cursor: default; animation: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 10px 0 var(--cd), 0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent); } 50% { box-shadow: 0 10px 0 var(--cd), 0 0 0 16px transparent; } }
.score { text-align: center; }
.score .n { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score.boys .n { color: var(--boys); } .score.girls .n { color: var(--girls); }
.score .lbl { color: var(--muted); font-weight: 800; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
.side-msg { min-height: 1.6em; font-family: var(--f-display); font-weight: 600; font-size: clamp(1rem, 1.8vw, 1.5rem); text-align: center; }

/* stage */
.stage {
  position: relative; min-height: 0; display: flex; flex-direction: column;
  background: var(--stage); border-radius: 22px; overflow: hidden;
  box-shadow: inset 0 0 0 2px var(--line), 0 24px 60px rgba(0,0,0,.4);
}
.valance { height: 34px; flex: none;
  background:
    radial-gradient(circle at 50% 0, var(--curtain) 70%, transparent 71%) 0 0 / 48px 34px repeat-x,
    linear-gradient(var(--curtain-2), var(--curtain-2)) 0 0 / 100% 12px no-repeat; }
.qbox { flex: none; padding: 10px 24px 6px; text-align: center; }
.q { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 3rem); line-height: 1.1; text-wrap: balance; margin: 0; }
.status { margin-top: 6px; font-weight: 800; color: var(--muted); font-size: clamp(.95rem, 1.5vw, 1.25rem); min-height: 1.5em; }
.status.boys { color: var(--boys); } .status.girls { color: var(--girls); }
.pic { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px 22px 22px; position: relative; }
.pic img.one { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.pic img.obj { max-height: 100%; max-width: 70%; border-radius: 20px; background: #FBF6EC; padding: 10px; box-sizing: border-box; }
.grid4 { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
.tile { position: relative; border-radius: 14px; overflow: hidden; background: #000; min-height: 0; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .tag { position: absolute; left: 10px; top: 10px; width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 700; font-size: clamp(1rem, 2vw, 1.6rem); }
.tile.right { box-shadow: inset 0 0 0 6px var(--gold); }
.tile.dim { opacity: .3; }
.answer { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) scale(.9); opacity: 0; pointer-events: none;
  padding: .45em 1.1em; border-radius: 999px; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.5rem, 3.4vw, 2.9rem);
  white-space: nowrap; color: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.5); transition: opacity .25s, transform .25s; }
.answer .zh { font-family: var(--f-zh); margin-left: .45em; font-size: .85em; }
.answer.show { opacity: 1; transform: translateX(-50%) scale(1); }
.answer.glove { color: #2A2238; }

/* teacher controls */
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.ctl { border: 0; border-radius: 14px; padding: 12px 20px; font: 800 clamp(.95rem, 1.4vw, 1.15rem) var(--f-body); cursor: pointer; color: var(--ink); background: var(--stage-2); box-shadow: inset 0 0 0 1px var(--line); }
.ctl.ok { background: var(--ok); color: #0E2A1C; box-shadow: none; }
.ctl.bad { background: var(--bad); color: #fff; box-shadow: none; }
.ctl.next { background: var(--gold); color: #2A2238; box-shadow: none; }
.ctl:disabled { opacity: .35; cursor: default; }
.hint { color: var(--muted); font-size: .8rem; text-align: center; }

/* end screen */
.end { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: color-mix(in srgb, var(--stage) 94%, transparent); text-align: center; padding: 20px; }
.end h2 { font-family: var(--f-display); font-size: clamp(2rem, 5vw, 4rem); margin: 0; }
.end p { margin: 0; font-size: clamp(1.1rem, 2vw, 1.6rem); color: var(--muted); font-weight: 800; }

@media (max-width: 700px) {
  body { overflow: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(320px, 1fr) auto; }
  .stage { grid-column: 1 / -1; grid-row: 1; }
  .side { grid-row: 2; }
  .buzz { width: min(100%, 140px); }
}
@media (prefers-reduced-motion: reduce) { .buzz.ready { animation: none; } .answer { transition: none; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">Puppet <span>Buzzer</span></div>
    <div class="round" id="round">Round <b>1</b> / 8</div>
    <div class="tools">
      <button class="icon-btn" id="sound" type="button" aria-pressed="true">Sound on</button>
      <button class="icon-btn" id="full" type="button">Full screen</button>
    </div>
  </header>

  <main class="main">
    <section class="side" aria-label="Boys">
      <button class="buzz boys ready" id="buzzBoys" type="button">BOYS<small>男生</small></button>
      <div class="side-msg" id="msgBoys"></div>
      <div class="score boys"><div class="n" id="scoreBoys">0</div><div class="lbl">Boys</div></div>
    </section>

    <section class="stage" aria-live="polite">
      <div class="valance" aria-hidden="true"></div>
      <div class="qbox">
        <h1 class="q" id="q">What puppet is this?</h1>
        <div class="status" id="status">Buzz in!</div>
      </div>
      <div class="pic" id="pic"></div>
      <div class="answer" id="answer"></div>
      <div class="end" id="end" hidden>
        <h2 id="endTitle">Great game!</h2>
        <p id="endScore"></p>
        <button class="ctl next" id="again" type="button">Play again</button>
      </div>
    </section>

    <section class="side" aria-label="Girls">
      <button class="buzz girls ready" id="buzzGirls" type="button">GIRLS<small>女生</small></button>
      <div class="side-msg" id="msgGirls"></div>
      <div class="score girls"><div class="n" id="scoreGirls">0</div><div class="lbl">Girls</div></div>
    </section>
  </main>

  <footer>
    <div class="controls">
      <button class="ctl ok" id="ok" type="button" disabled>✓ Correct</button>
      <button class="ctl bad" id="bad" type="button" disabled>✗ Wrong</button>
      <button class="ctl" id="reveal" type="button">Show answer</button>
      <button class="ctl" id="reset" type="button">Reset buzzers</button>
      <button class="ctl next" id="next" type="button">Next round →</button>
    </div>
    <div class="hint">Keyboard: Q = Boys · P = Girls · C = Correct · X = Wrong · A = Show answer · → = Next</div>
  </footer>
</div>

const NAMES = {
  rod:    { en: 'rod puppet',    zh: '杖頭偶' },
  string: { en: 'string puppet', zh: '懸絲偶' },
  glove:  { en: 'glove puppet',  zh: '手套偶' },
  shadow: { en: 'shadow puppet', zh: '皮影偶' },
};
const ROUNDS = [
  { type: 'photo', img: 'popo',          q: 'What puppet is this?',            ans: 'glove' },
  { type: 'pick4', imgs: ['s_rod', 's_shadow', 's_string', 's_glove'], q: 'Which one is the string puppet?', ans: 'string' },
  { type: 'clue',  img: 'obj_stick',     q: 'Which puppet moves with sticks?', ans: 'rod' },
  { type: 'photo', img: 'prince_shadow', q: 'What puppet is this?',            ans: 'shadow' },
  { type: 'pick4', imgs: ['s_glove', 's_string', 's_shadow', 's_rod'], q: 'Which one is the glove puppet?', ans: 'glove' },
  { type: 'photo', img: 'old_lady',      q: 'What puppet is this?',            ans: 'string' },
  { type: 'clue',  img: 'obj_light',     q: 'Which puppet moves with light?',  ans: 'shadow' },
  { type: 'photo', img: 'laixi',         q: 'What puppet is this?',            ans: 'rod' },
];
const $ = (id) => document.getElementById(id);
const S = { i: 0, phase: 'open', turn: null, out: new Set(), score: { boys: 0, girls: 0 }, sound: true };
const LABEL = { boys: 'Boys', girls: 'Girls' };

/* ---------- sound (WebAudio, no files) ---------- */
let ac = null;
function tone(freq, dur, type = 'square', vol = .18, when = 0) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  boys: () => { tone(523, .12); tone(784, .22, 'square', .18, .1); },
  girls: () => { tone(659, .12); tone(988, .22, 'square', .18, .1); },
  ok: () => { tone(660, .12, 'triangle', .25); tone(880, .12, 'triangle', .25, .12); tone(1175, .3, 'triangle', .25, .24); },
  bad: () => { tone(140, .45, 'sawtooth', .2); },
};

/* ---------- render ---------- */
function render() {
  const r = ROUNDS[S.i];
  $('round').innerHTML = `Round <b>${S.i + 1}</b> / ${ROUNDS.length}`;
  $('q').textContent = r.q;
  const pic = $('pic'); pic.innerHTML = '';
  if (r.type === 'pick4') {
    const g = document.createElement('div'); g.className = 'grid4';
    r.imgs.forEach((k, n) => {
      const t = document.createElement('div'); t.className = 'tile'; t.dataset.key = k;
      t.innerHTML = `<img alt="Puppet photo ${'ABCD'[n]}" src="${IMG[k]}"><span class="tag">${'ABCD'[n]}</span>`;
      g.appendChild(t);
    });
    pic.appendChild(g);
  } else {
    const im = document.createElement('img');
    im.className = r.type === 'clue' ? 'obj' : 'one'; im.alt = r.type === 'clue' ? 'Clue picture' : 'Puppet photo'; im.src = IMG[r.img];
    pic.appendChild(im);
  }
  const a = $('answer'); a.className = 'answer'; a.innerHTML = '';
  S.phase = 'open'; S.turn = null; S.out = new Set();
  $('end').hidden = true;
  syncButtons();
}
function syncButtons() {
  for (const t of ['boys', 'girls']) {
    const b = $(t === 'boys' ? 'buzzBoys' : 'buzzGirls');
    const m = $(t === 'boys' ? 'msgBoys' : 'msgGirls');
    b.classList.remove('ready', 'won', 'off');
    if (S.phase === 'open' && !S.out.has(t)) { b.classList.add('ready'); m.textContent = ''; }
    else if (S.phase === 'answering' && S.turn === t) { b.classList.add('won'); m.textContent = 'Answer!'; }
    else { b.classList.add('off'); m.textContent = S.out.has(t) && S.phase !== 'revealed' ? 'Out this round' : ''; }
    m.style.color = t === 'boys' ? 'var(--boys)' : 'var(--girls)';
  }
  const st = $('status'); st.className = 'status';
  if (S.phase === 'open') st.textContent = S.out.size ? `${LABEL[[...S.out][0] === 'boys' ? 'girls' : 'boys']}, your turn! Buzz in!` : 'Buzz in!';
  else if (S.phase === 'answering') { st.textContent = `${LABEL[S.turn]}, answer!`; st.classList.add(S.turn); }
  else st.textContent = '';
  $('ok').disabled = $('bad').disabled = S.phase !== 'answering';
  $('reveal').disabled = S.phase === 'revealed';
  $('next').textContent = S.i === ROUNDS.length - 1 ? 'Final score →' : 'Next round →';
}
function buzz(team) {
  if (S.phase !== 'open' || S.out.has(team)) return;
  S.phase = 'answering'; S.turn = team; sfx[team](); syncButtons();
}
function reveal() {
  const r = ROUNDS[S.i], a = $('answer'), n = NAMES[r.ans];
  let pre = '';
  if (r.type === 'pick4') {
    const idx = r.imgs.indexOf('s_' + r.ans); pre = 'ABCD'[idx] + ' · ';
    document.querySelectorAll('.tile').forEach((t, k) => t.classList.add(k === idx ? 'right' : 'dim'));
  }
  a.innerHTML = `${pre}${n.en}<span class="zh">${n.zh}</span>`;
  a.style.background = `var(--${r.ans})`;
  a.className = `answer show ${r.ans}`;
  S.phase = 'revealed'; syncButtons();
}
function correct() {
  if (S.phase !== 'answering') return;
  S.score[S.turn]++; sfx.ok(); updScore(); reveal();
}
function wrong() {
  if (S.phase !== 'answering') return;
  sfx.bad(); S.out.add(S.turn); S.turn = null;
  if (S.out.size >= 2) { reveal(); return; }
  S.phase = 'open'; syncButtons();
}
function resetBuzz() { if (S.phase === 'revealed') return; S.phase = 'open'; S.turn = null; S.out = new Set(); syncButtons(); }
function updScore() { $('scoreBoys').textContent = S.score.boys; $('scoreGirls').textContent = S.score.girls; }
function next() {
  if (S.i < ROUNDS.length - 1) { S.i++; render(); return; }
  const { boys, girls } = S.score;
  $('endTitle').textContent = boys === girls ? "It's a tie!" : (boys > girls ? 'Boys win!' : 'Girls win!');
  $('endScore').textContent = `Boys ${boys} : ${girls} Girls`;
  $('end').hidden = false; S.phase = 'revealed'; syncButtons();
}
function again() { S.i = 0; S.score = { boys: 0, girls: 0 }; updScore(); render(); }

/* ---------- input ---------- */
$('buzzBoys').addEventListener('pointerdown', (e) => { e.preventDefault(); buzz('boys'); });
$('buzzGirls').addEventListener('pointerdown', (e) => { e.preventDefault(); buzz('girls'); });
$('ok').addEventListener('click', correct);
$('bad').addEventListener('click', wrong);
$('reveal').addEventListener('click', reveal);
$('reset').addEventListener('click', resetBuzz);
$('next').addEventListener('click', next);
$('again').addEventListener('click', again);
$('sound').addEventListener('click', () => { S.sound = !S.sound; $('sound').textContent = S.sound ? 'Sound on' : 'Sound off'; $('sound').setAttribute('aria-pressed', S.sound); });
$('full').addEventListener('click', () => {
  const d = document.documentElement;
  try { (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.())?.catch?.(() => {}); } catch (e) {}
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'q') buzz('boys');
  else if (k === 'p') buzz('girls');
  else if (k === 'c') correct();
  else if (k === 'x') wrong();
  else if (k === 'a') reveal();
  else if (k === 'arrowright' || k === 'enter') next();
});
render();
